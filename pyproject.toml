[project]
name = "plorangelab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bpodol", email = "bodikpodol@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "numba>=0.68.0",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.9",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.1",
    "testcontainers[postgres]>=4.15.0",
]
