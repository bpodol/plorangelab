[project]
name = "plorangelab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bpodol", email = "bodikpodol@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "numba>=0.68.0",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "diff-cover>=11.0.4",
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pytest-gremlins>=1.15.0",
    "ruff>=0.17.1",
    "testcontainers[postgres]>=4.15.0",
]

[tool.coverage.run]
source = ["plorangelab"]
branch = true
relative_files = true
core = "ctrace"

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 2

# Coverage.py cannot reliably measure runtime execution
# inside Numba-compiled functions.
# Compiled kernels are tested separately.
exclude_also = [
    '^\s*@(?:numba\.)?njit\b',
]

[tool.coverage.json]
show_contexts = true

[tool.pytest-gremlins]
paths = ["src/plorangelab"]
workers = 4
cache = true
report = ["console", "json"]
